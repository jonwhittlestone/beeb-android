name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Unit tests, lint and release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # compileSdk 37 isn't preinstalled on the runner image.
      - name: Install SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null || true

      - name: Run unit tests
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Lint
        run: ./gradlew --console=plain lintDebug

      # The keystore lives in repository secrets (base64), never in git.
      # Without secrets (e.g. PRs from forks) the release APK is built unsigned.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.BEEB_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/beeb-jon.jks"
          echo "BEEB_KEYSTORE_PATH=$RUNNER_TEMP/beeb-jon.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          BEEB_KEYSTORE_PASSWORD: ${{ secrets.BEEB_KEYSTORE_PASSWORD }}
          BEEB_KEY_ALIAS: beeb
        run: ./gradlew --console=plain assembleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: beeb-jon-release
          path: app/build/outputs/apk/release/*.apk
